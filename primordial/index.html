<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="PRIMORDIAL — an artificial life laboratory. Five living simulations emerging from simple rules.">
<title>PRIMORDIAL · artificial life laboratory</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="view"></canvas>

<header id="topbar">
  <div class="brand">PRIMORDIAL<small>artificial life laboratory</small></div>
  <nav id="tabs"></nav>
</header>

<button id="panel-open" class="ghost" title="show controls">CONTROLS</button>

<aside id="panel">
  <button id="panel-close" title="hide panel">&#187;</button>
  <div id="panel-scroll">
    <div id="tools">
      <button id="btn-audio" class="ghost" title="generative soundscape driven by the living state">AUDIO</button>
      <button id="btn-shot" class="ghost" title="save a PNG of the current world">SNAPSHOT</button>
      <button id="btn-rec" class="ghost" title="record the canvas to WEBM">REC</button>
    </div>
    <div id="controls"></div>
    <section id="seeds">
      <h3>SEED BANK</h3>
      <div id="seed-list"></div>
    </section>
    <section id="jar">
      <h3>SPECIMEN JAR</h3>
      <div class="jar-save">
        <input id="jar-name" type="text" placeholder="name this specimen" maxlength="32" autocomplete="off" spellcheck="false">
        <button id="jar-save-btn" class="ghost">SAVE</button>
      </div>
      <ul id="jar-list"></ul>
    </section>
  </div>
</aside>

<footer id="statusbar">
  <span id="stat-fps">-- fps</span>
  <span id="stat-entities"></span>
  <span id="hint"></span>
  <span id="keys">SPACE pause · R reset · M mutate · A audio · H hide ui</span>
  <span id="rec-flag">REC</span>
  <span id="paused-flag"></span>
</footer>

<script src="js/core.js"></script>
<script src="js/sim-particle-life.js"></script>
<script src="js/sim-physarum.js"></script>
<script src="js/sim-boids.js"></script>
<script src="js/sim-gray-scott.js"></script>
<script src="js/sim-evolution.js"></script>
<script src="js/audio.js"></script>
<script src="js/main.js"></script>
</body>
</html>
